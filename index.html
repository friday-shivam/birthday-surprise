<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safar Se Soulmates, chapter 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#BCD7EE; --ink:#16181B; --soft:#3A4756; --paper:#FFF7E0; --edge:#FFFFFF;
  --teal:#3B7C95; --on-teal:#FFFFFF; --red:#DD4A2E; --sun:#F4B61F;
  --shadow:rgba(20,45,80,.32);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#0E1A2A; --ink:#F3EEDF; --soft:#A9B7C6; --paper:#1A2A3F; --edge:#34495F;
    --teal:#78B9D0; --on-teal:#0B1620; --red:#FF7B5E; --sun:#F6C544; --shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0E1A2A; --ink:#F3EEDF; --soft:#A9B7C6; --paper:#1A2A3F; --edge:#34495F;
  --teal:#78B9D0; --on-teal:#0B1620; --red:#FF7B5E; --sun:#F6C544; --shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.booting,html.booting body{overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* boot terminal */
#boot{position:fixed;inset:0;z-index:50;background:#0C1118;color:#DCE6EE;font-family:var(--mono);
  display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 26px calc(env(safe-area-inset-bottom,0px) + 28px);
  transition:opacity .7s ease,visibility .7s}
#boot.gone{opacity:0;visibility:hidden}
#bootlog{max-width:34rem;width:100%;margin:0 auto;min-height:15rem;font-size:.9rem;line-height:1.95}
#bootlog div{white-space:pre-wrap;word-break:break-word}
#bootlog .cmd{color:#78B9D0}
#bootlog .ok{color:#F6C544}
#lock{max-width:34rem;width:100%;margin:.6rem auto 0}
.lockrow{display:flex;gap:.6rem}
#word{flex:1;min-width:0;font:400 1rem var(--mono);color:#DCE6EE;background:transparent;border:1.5px solid #78B9D0;border-radius:8px;padding:.8rem .9rem}
#word::placeholder{color:#6F8090}
#unlockBtn{font:600 1rem var(--mono);color:#0C1118;background:#78B9D0;border:0;border-radius:8px;padding:.8rem 1rem;cursor:pointer}
#unlockBtn:disabled{opacity:.6}
#lockmsg{min-height:1.6rem;margin-top:.6rem;font-size:.9rem;color:#FF7B5E}
#go{align-self:center;margin-top:1.6rem;font:600 1rem var(--mono);color:#0C1118;background:#F6C544;border:0;border-radius:10px;
  padding:.95rem 1.5rem;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;pointer-events:none}
#go.show{opacity:1;transform:none;pointer-events:auto}
#go:active{transform:scale(.97)}

/* hero */
.hero{min-height:92svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:9vh 24px 6vh;text-align:center}
.ticket{width:min(100%,25rem);background:var(--paper);border-radius:16px;overflow:hidden;transform:rotate(-3deg);
  box-shadow:0 0 0 6px var(--edge),0 22px 34px -12px var(--shadow)}
.ticket-bar{background:var(--teal);color:var(--on-teal);display:flex;justify-content:space-between;align-items:center;
  padding:.5rem .9rem;font:600 .78rem var(--mono)}
.ticket-bar svg{width:26px;height:14px}
.ticket-body{display:flex;align-items:stretch;gap:.9rem;padding:1rem 1rem 1.1rem}
.barcode{flex:0 0 30px;border-right:2px dashed var(--ink);padding-right:.8rem;box-sizing:content-box;
  background:repeating-linear-gradient(180deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 12px,transparent 12px 14px) content-box}
h1{font:900 clamp(3.3rem,17vw,5.6rem)/.86 var(--display);text-transform:uppercase;letter-spacing:.005em;text-align:left;flex:1;min-width:0}
.lede{max-width:27rem;margin-top:3rem;font-size:1.15rem}
.cue{margin-top:2.2rem;font:400 .85rem var(--mono);color:var(--soft)}
.cue svg{display:block;margin:.7rem auto 0;width:22px;height:22px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(7px)}}

/* route */
.route{position:relative;max-width:46rem;margin:0 auto;padding:14vh 20px 20vh}
.route svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#sky{z-index:0}
#fly{z-index:2}
.trail{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 10;opacity:.28}
.flown{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 10}
.pin{fill:var(--edge);stroke:var(--ink);stroke-width:2.5;transition:fill .35s}
.pin.on{fill:var(--red)}
#plane polygon{fill:var(--edge);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
#plane line{stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.stop{position:relative;z-index:1;width:min(78%,24rem);background:var(--paper);border-radius:14px;padding:10px 10px 1.1rem;
  box-shadow:0 0 0 5px var(--edge),0 18px 30px -12px var(--shadow);margin-bottom:clamp(130px,26vh,230px)}
.stop:nth-of-type(odd){margin-right:auto;transform:rotate(-1.4deg)}
.stop:nth-of-type(even){margin-left:auto;transform:rotate(1.2deg)}
.stop:last-of-type{margin-bottom:0}
.photo{aspect-ratio:4/3;border-radius:8px;overflow:hidden;display:grid;place-items:center;
  background:color-mix(in srgb,var(--teal) 24%,var(--paper));font:400 .8rem var(--mono);color:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.stop h2{font:700 1.7rem/1.05 var(--display);margin:.9rem .4rem .35rem}
.stop.bubble h2{display:inline-block;border:2.5px solid var(--ink);border-radius:22px;padding:.3em .6em;margin-left:.1rem;background:var(--edge)}
.stop p{margin:0 .4rem;font-size:1rem}

/* letter */
.letter{max-width:34rem;margin:0 auto;padding:4vh 26px 12vh}
.letter h2,.gate h2{font:900 clamp(2.4rem,11vw,3.6rem)/.95 var(--display);text-transform:uppercase;margin-bottom:1.4rem}
.letter p{margin-bottom:1.15rem;font-size:1.15rem}
.letter .sign{font-style:italic;color:var(--soft)}

/* gate */
.gate{padding:6vh 20px 12vh;text-align:center}
.gate > p{max-width:24rem;margin:0 auto 2.4rem}
.pass{position:relative;max-width:25rem;margin:0 auto;text-align:left;background:var(--paper);border-radius:16px;
  box-shadow:0 0 0 6px var(--edge),0 22px 34px -12px var(--shadow)}
.pass-bar{background:var(--teal);color:var(--on-teal);border-radius:16px 16px 0 0;padding:.6rem 1rem;display:flex;justify-content:space-between;font:600 .8rem var(--mono)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem .8rem;padding:1.1rem 1rem 1.3rem}
.fields div{min-width:0}
.fields dt{font:400 .72rem var(--mono);color:var(--soft)}
.fields dd{font:600 .98rem var(--mono);overflow-wrap:anywhere}
.fields .wide{grid-column:1/-1}
.fields .wide dd{font-size:clamp(1.4rem,7.4vw,1.95rem);line-height:1.15;letter-spacing:.02em}
.tear{position:relative;height:0;border-top:2px dashed var(--ink);opacity:.9;margin:0 18px}
.tear::before,.tear::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--sky)}
.tear::before{left:-29px}.tear::after{right:-29px}
.stub{padding:1.1rem 1rem 1.1rem}
.stub .bars{height:34px;margin-bottom:1rem;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
#checkin{width:100%;font:600 1rem var(--mono);color:var(--sky);background:var(--ink);border:0;border-radius:10px;padding:1rem;cursor:pointer}
#checkin:active{transform:scale(.98)}
#checkin:disabled{background:var(--teal);color:var(--on-teal);cursor:default;transform:none}
.stamp{position:absolute;right:16px;bottom:78px;font:600 1rem var(--mono);color:var(--red);border:3px double var(--red);border-radius:8px;background:var(--paper);
  padding:.25rem .6rem;transform:rotate(-12deg) scale(2.2);opacity:0;pointer-events:none}
.pass.done .stamp{opacity:.92;transform:rotate(-12deg) scale(1);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .15s}
#after{max-width:24rem;margin:2.2rem auto 0;font-size:1.15rem;opacity:0;transition:opacity .8s .5s}
#after.show{opacity:1}

footer{text-align:center;padding:4vh 24px 9vh}
footer a{font-weight:600;text-underline-offset:4px}
footer small{display:block;margin-top:1.2rem;font:400 .8rem var(--mono);color:var(--soft)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div id="boot" role="dialog" aria-label="Unlocking your surprise">
  <div id="bootlog" aria-live="polite"></div>
  <div id="lock" hidden>
    <div class="lockrow">
      <input id="word" type="text" aria-label="Secret word" placeholder="name-on-dd-mm-yyyy" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button id="unlockBtn" type="button">Unlock</button>
    </div>
    <p id="lockmsg" aria-live="polite"></p>
  </div>
  <button id="go" type="button">Begin the journey</button>
</div>

<main>
  <section class="hero">
    <div class="ticket">
      <div class="ticket-bar"><span>safar se soulmates</span>
        <svg viewBox="-14 -10 28 20" aria-hidden="true"><polygon points="13,0 -12,-9 -6,0 -12,9" fill="currentColor"/></svg>
      </div>
      <div class="ticket-body">
        <div class="barcode" aria-hidden="true"></div>
        <h1>Happy<br>birthday</h1>
      </div>
    </div>
    <p class="lede" id="lede"></p>
    <p class="cue">scroll to take off
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M5 13l7 7 7-7"/></svg>
    </p>
  </section>

  <section class="route" id="route" aria-label="Memories from our first trip">
    <svg id="sky" aria-hidden="true">
      <defs><clipPath id="clip"><rect id="clipRect" x="-50" y="-10" width="0" height="0"/></clipPath></defs>
      <path id="trail" class="trail"/>
      <path id="flown" class="flown" clip-path="url(#clip)"/>
      <g id="pins"></g>
    </svg>
    <svg id="fly" aria-hidden="true">
      <g id="plane"><polygon points="15,0 -13,-10 -6,0 -13,10"/><line x1="-6" y1="0" x2="15" y2="0"/></g>
    </svg>
  </section>

  <section class="letter" id="letter"></section>

  <section class="gate">
    <h2>Chapter 2</h2>
    <p id="gateLine"></p>
    <div class="pass" id="pass">
      <div class="pass-bar"><span>boarding pass</span><span>SS 002</span></div>
      <dl class="fields">
        <div><dt>passenger</dt><dd id="fPassenger"></dd></div>
        <div><dt>seat</dt><dd>next to me</dd></div>
        <div class="wide"><dt>destination</dt><dd id="fDest" aria-live="polite">▒▒▒▒▒▒▒▒▒</dd></div>
        <div><dt>from</dt><dd id="fFrom"></dd></div>
        <div><dt>when</dt><dd id="fWhen">▒▒▒▒▒</dd></div>
      </dl>
      <div class="tear" aria-hidden="true"></div>
      <div class="stub">
        <div class="bars" aria-hidden="true"></div>
        <button id="checkin" type="button">Check in</button>
      </div>
      <span class="stamp" aria-hidden="true">approved</span>
    </div>
    <p id="after"></p>
  </section>

  <footer>
    <p>The rest of the journey lives at <a id="insta" target="_blank" rel="noopener"></a></p>
    <small id="credit"></small>
  </footer>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

const $ = (s, r = document) => r.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const NS = "http://www.w3.org/2000/svg";
let passenger = "";
const route = $("#route");

/* ---------- fill the page from CONFIG ---------- */
function render() {
passenger = CONFIG.her || "the birthday girl";
$("#lede").textContent = CONFIG.lede;
$("#fFrom").textContent = CONFIG.from;
$("#gateLine").textContent = CONFIG.gateLine;

CONFIG.memories.forEach((m, i) => {
  const a = document.createElement("article");
  a.className = "stop" + (m.bubble ? " bubble" : "");
  const ph = document.createElement("div");
  ph.className = "photo";
  if (m.ratio) ph.style.aspectRatio = m.ratio;
  if (m.photo) {

  }

});

const letter = $("#letter");
const lh = document.createElement("h2"); lh.textContent = CONFIG.letterTitle; letter.append(lh);
CONFIG.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; letter.append(p); });
const sg = document.createElement("p"); sg.className = "sign"; sg.textContent = CONFIG.sign; letter.append(sg);

$("#fPassenger").textContent = passenger;
const insta = $("#insta");
insta.textContent = "@" + CONFIG.instagram;
insta.href = "https://www.instagram.com/" + CONFIG.instagram + "/";
$("#credit").textContent = "built by hand for you" + (CONFIG.him ? ", by " + CONFIG.him : "") + " / v1.0.0";

}

/* ---------- boot sequence ---------- */
const log = $("#bootlog"), go = $("#go"), bootEl = $("#boot");
function line(cls) { const d = document.createElement("div"); if (cls) d.className = cls; log.append(d); return d; }
async function type(el, text) {
  if (reduce) { el.textContent = text; return; }
  for (const ch of text) { el.textContent += ch; await sleep(26); }
}
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
// The secret word is never stored. It only works as the key that decrypts the content.
async function openVault(word) {
  const norm = word.normalize("NFKC").toLowerCase().replace(/[^a-z0-9]/g, "");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function askWord() {
  return new Promise(resolve => {
    const box = $("#lock"), input = $("#word"), msg = $("#lockmsg"), btn = $("#unlockBtn");
    box.hidden = false;
    if (!(window.crypto && crypto.subtle)) { msg.textContent = "this page needs to be opened over https."; return; }
    async function attempt() {
      if (!input.value.trim() || btn.disabled) return;
      btn.disabled = true; msg.textContent = "verifying…";
      try {
        CONFIG = await openVault(input.value);
        box.hidden = true; input.blur(); resolve();
      } catch (e) {
        msg.textContent = "access denied. try again.";
        btn.disabled = false; input.value = ""; input.focus();
      }
    }
    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
  });
}
async function boot() {
  await type(line("cmd"), "$ puzzle --status"); await sleep(280);
  line().textContent = "assembled 100%, every piece in place"; await sleep(420);
  await type(line("cmd"), "$ scan --passenger"); await sleep(280);
  if (VAULT) {
    line().textContent = "identity check: say the secret word";
    if (VAULT.hint) line().textContent = "hint: " + VAULT.hint;
    await askWord();
  }
  render();
  line().textContent = "match found: " + passenger; await sleep(420);
  await type(line("cmd"), "$ unlock chapter_01"); await sleep(280);
  const bar = line();
  for (let i = 0; i <= 18; i++) {
    bar.textContent = "[" + "█".repeat(i) + "░".repeat(18 - i) + "] " + Math.round(i / 18 * 100) + "%";
    await sleep(55);
  }
  line("ok").textContent = "unlocked. happy birthday.";
  go.classList.add("show");
}
go.addEventListener("click", () => {
  bootEl.classList.add("gone");
  document.documentElement.classList.remove("booting");
  layout();
});
boot();

/* ---------- the flight path ---------- */
const sky = $("#sky"), fly = $("#fly"), trail = $("#trail"), flown = $("#flown"),
      clipRect = $("#clipRect"), plane = $("#plane"), pinsG = $("#pins");
let anchors = [], total = 0, W = 0, H = 0, cur = 0;

function fitTitle() {
  const h = document.querySelector("h1");
  h.style.fontSize = "";
  let size = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth && size > 28) { size -= 2; h.style.fontSize = size + "px"; }
}

function layout() {
  fitTitle();
  W = route.clientWidth; H = route.clientHeight;
  if (!W || !H) return;
  sky.setAttribute("viewBox", `0 0 ${W} ${H}`);
  fly.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const stops = [...route.querySelectorAll(".stop")];
  anchors = stops.map((el, i) => {
    const l = el.offsetLeft, r = l + el.offsetWidth, y = el.offsetTop + el.offsetHeight / 2;
    const x = i % 2 === 0 ? Math.min(W - 22, (r + W) / 2) : Math.max(22, l / 2);
    return { x, y };
  });
  const pts = [{ x: W / 2, y: 0 }, ...anchors, { x: W / 2, y: H }];
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], k = (b.y - a.y) * 0.58;
    d += ` C${a.x},${a.y + k} ${b.x},${b.y - k} ${b.x},${b.y}`;
  }
  trail.setAttribute("d", d);
  flown.setAttribute("d", d);
  total = trail.getTotalLength();
  clipRect.setAttribute("width", W + 100);
  pinsG.replaceChildren(...anchors.map(a => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", a.x); c.setAttribute("cy", a.y); c.setAttribute("r", 7);
    c.setAttribute("class", "pin");
    a.pin = c;
    return c;
  }));
}

// y only ever increases along the path, so a binary search finds the point at a given height
function lenAtY(y) {
  let lo = 0, hi = total;
  for (let i = 0; i < 18; i++) {
    const mid = (lo + hi) / 2;
    if (trail.getPointAtLength(mid).y < y) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function frame() {
  if (total) {
    const top = route.getBoundingClientRect().top;
    const target = Math.max(0, Math.min(H, innerHeight * 0.5 - top));
    cur = reduce ? target : cur + (target - cur) * 0.14;
    if (Math.abs(target - cur) < 0.3) cur = target;
    const len = lenAtY(cur);
    const p = trail.getPointAtLength(len);
    const q = trail.getPointAtLength(Math.min(total, len + 2));
    const ang = (q.y - p.y) + Math.abs(q.x - p.x) < 0.01 ? 90 : Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    plane.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    clipRect.setAttribute("height", Math.max(0, p.y + 10));
    for (const a of anchors) a.pin.classList.toggle("on", p.y >= a.y - 4);
  }
  requestAnimationFrame(frame);
}

new ResizeObserver(layout).observe(route);
addEventListener("load", layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
requestAnimationFrame(frame);

/* ---------- check-in reveal ---------- */
function scramble(el, final, dur) {
  if (reduce) { el.textContent = final; return Promise.resolve(); }
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
  const t0 = performance.now();
  return new Promise(done => {
    (function tick(now) {
      const t = Math.min(1, (now - t0) / dur);
      const shown = Math.floor(t * final.length);
      let s = final.slice(0, shown);
      for (let i = shown; i < final.length; i++) s += final[i] === " " ? " " : chars[Math.random() * chars.length | 0];
      el.textContent = s;
      if (t < 1) requestAnimationFrame(tick); else { el.textContent = final; done(); }
    })(t0);
  });
}

function confetti() {
  if (reduce) return;
  const c = $("#confetti"), x = c.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr; x.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--red", "--teal", "--sun", "--edge", "--ink"].map(v => css.getPropertyValue(v).trim());
  const P = Array.from({ length: 150 }, () => ({
    x: w / 2 + (Math.random() - 0.5) * 140, y: h * 0.6,
    vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 17 - 6,
    s: Math.random() * 7 + 5, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
    c: cols[Math.random() * cols.length | 0]
  }));
  const t0 = performance.now();
  (function draw(now) {
    x.clearRect(0, 0, w, h);
    for (const p of P) {
      p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
      x.restore();
    }
    if (now - t0 < 4000) requestAnimationFrame(draw); else x.clearRect(0, 0, w, h);
  })(t0);
}

const btn = $("#checkin");
btn.addEventListener("click", async () => {
  btn.disabled = true;
  btn.textContent = "Checking in…";
  await Promise.all([
    scramble($("#fDest"), CONFIG.next.destination, 1500),
    scramble($("#fWhen"), CONFIG.next.when, 1100)
  ]);
  $("#pass").classList.add("done");
  btn.textContent = "Checked in";
  const after = $("#after");
  after.textContent = CONFIG.next.message;
  after.classList.add("show");
  confetti();
});
